server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: memora-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memora_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
    open-in-view: false

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Memora AI & Integration Configuration
memora:
  ai:
    provider: ${MEMORA_AI_PROVIDER:auto} # "auto", "gemini", "groq", or "fallback"
    gemini:
      api-key: ${MEMORA_GEMINI_API_KEY:${MEMORA_AI_API_KEY:}}
      model: ${MEMORA_AI_MODEL:gemini-3.6-flash}
    groq:
      api-key: ${MEMORA_GROQ_API_KEY:}
      model: ${MEMORA_GROQ_MODEL:openai/gpt-oss-120b}
    # Backward compatibility aliases
    api-key: ${MEMORA_GEMINI_API_KEY:${MEMORA_AI_API_KEY:}}
    model: ${MEMORA_AI_MODEL:gemini-3.6-flash}
    timeout-ms: ${MEMORA_AI_TIMEOUT_MS:10000}
    temperature: ${MEMORA_AI_TEMPERATURE:0.3}
  dictionary:
    provider: ${MEMORA_DICTIONARY_PROVIDER:merriam-webster}
    api-url: ${MEMORA_MERRIAM_WEBSTER_API_URL:https://www.dictionaryapi.com/api/v3/references/collegiate/json}
    api-key: ${MEMORA_MERRIAM_WEBSTER_API_KEY:}
    connect-timeout-ms: ${MEMORA_DICTIONARY_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MEMORA_DICTIONARY_READ_TIMEOUT_MS:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.memora: DEBUG
    org.hibernate.SQL: DEBUG

