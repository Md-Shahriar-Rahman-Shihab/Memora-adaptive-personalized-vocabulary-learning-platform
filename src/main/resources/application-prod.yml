server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0

spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

logging:
  level:
    root: INFO
    com.memora: INFO
    org.hibernate.SQL: WARN
